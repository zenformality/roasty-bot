# render's free tier sleeps after ~15 idle minutes, which would kill the
# slack connection too. this pokes the demo url every 10 minutes to keep
# it warm.
#
# after the first render deploy: repo settings -> secrets and variables ->
# actions -> add DEMO_URL (e.g. https://roasty-bot-demo.onrender.com)
#
# heads up: github disables scheduled workflows after ~60 days without any
# commits. pushing literally anything resets the clock.

name: keep-alive

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  poke:
    runs-on: ubuntu-latest
    steps:
      - name: poke the bot
        run: curl -sf --max-time 30 "${{ secrets.DEMO_URL }}" || echo "asleep or DEMO_URL not set yet"
