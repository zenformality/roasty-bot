name: keep-alive

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  poke:
    runs-on: ubuntu-latest
    steps:
      - name: poke the bot
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 90 "${{ secrets.DEMO_URL }}")
          echo "got HTTP $code"
          test "$code" = "200"
