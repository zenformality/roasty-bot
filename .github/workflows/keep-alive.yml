# render's free tier sleeps after ~15 idle minutes, which kills the slack
# connection too.
#
# PRIMARY keep-alive: cron-job.org (precise timers). set it up once:
#   cron-job.org -> create cronjob -> GET https://roasty-bot-demo.onrender.com
#   -> schedule: every 5 minutes -> save. done.
#
# THIS workflow is only a backup net, because github's free runners delay
# scheduled jobs by 20-55+ minutes (way past render's 15-min nap window).
# it fails LOUDLY on purpose when the site doesn't answer, so a red x here
# means the demo url is actually broken.
#
# heads up: github also disables scheduled workflows after ~60 days without
# any commits. pushing literally anything resets the clock.

name: keep-alive

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  poke:
    runs-on: ubuntu-latest
    steps:
      - name: poke the bot
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 90 "${{ secrets.DEMO_URL }}")
          echo "got HTTP $code"
          test "$code" = "200"
